# Starter Nginx config — intentionally incomplete.
# Challenge 1: add an upstream block and proxy_pass to distribute
# requests across multiple Flask replicas.
#
# Hint: you'll need something like:
#
#   upstream flask_app {
#       server flask_1:5000;
#       server flask_2:5000;
#       server flask_3:5000;
#   }
#
# Then reference it in the location block below.

events {
    worker_connections 1024;
}

http {
    server {
        listen 80;

        location /health {
            # TODO: proxy to upstream
            return 200 "nginx ok\n";
            add_header Content-Type text/plain;
        }

        location / {
            # TODO: proxy_pass to your upstream
            return 503 "No upstream configured yet.\n";
            add_header Content-Type text/plain;
        }
    }
}
